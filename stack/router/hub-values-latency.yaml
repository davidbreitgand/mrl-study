# Hub EPP values — latency-observation-scorer-hub variant.
#
# The third production Distribution-axis scorer. Reads a
# TTFT-vs-inflight-load curve published by the paired
# latency-observer-producer-hub.
#
# Sole Distribution-axis scorer. NO Affinity-axis scorers.
#
# Requires --allow-experimental-plugins (matches how every hub-values
# in this study is configured).

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    # The registry/repository/tag values below are placeholders.
    # scripts/deploy-hub.sh overrides them at deploy time from either
    #   (a) EPP_REGISTRY / EPP_REPOSITORY env vars, or
    #   (b) the ${STUDY_DIR}/.epp-image file written by
    #       scripts/build-image.sh.
    # Example production values: registry: ghcr.io/davidbreitgand
    image:
      registry: PLACEHOLDER_OVERRIDDEN_BY_DEPLOY_HUB
      repository: mrl-aware-epp
      tag: latest
      pullPolicy: Always

    flags:
      allow-experimental-plugins: true

    pluginsConfigFile: "latency-hub-plugins.yaml"
    pluginsCustomConfig:
      latency-hub-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
          - type: single-profile-handler
          - type: label-selector-filter
            name: gemma-only
            parameters:
              matchLabels:
                served-model: gemma-4-26b-a4b
          - type: decode-filter
          - type: max-score-picker
          - type: latency-observer-producer-hub
            name: ttft-observer
            parameters:
              intervalDuration: 1s
              minRequests: 10
          - type: latency-observation-scorer-hub
            name: latency
            parameters:
              ttftPercentilesProducerName: ttft-observer
          # Per-request spoke attribution — see hub-values-mrl.yaml for
          # the rationale.
          - type: destination-endpoint-served
          - type: multicluster-file-discovery
            name: multicluster-file-discovery
            parameters:
              path: /etc/epp/clusters.yaml
              watchFile: true
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: gemma-only
              - pluginRef: decode-filter
              - pluginRef: latency
              - pluginRef: max-score-picker
        dataLayer:
          injectDefaults: false
          discovery:
            endpoints:
              pluginRef: multicluster-file-discovery
          sources:
            # Drives the ttft observer's recompute.
            - pluginRef: ttft-observer
            # inflight-load-producer is NOT listed here: it does not
            # implement fwkdl.DataSource. The framework auto-creates and
            # wires it via the Consumes/Produces DataKey match on the
            # latency-observation-scorer-hub's Required InFlightLoadDataKey
            # declaration. Its request-control hooks keep it ticking without
            # needing a poll-driven source entry.

    volumes:
      - name: clusters
        configMap:
          name: mrl-headtohead-clusters
    volumeMounts:
      - name: clusters
        mountPath: /etc/epp/clusters.yaml
        subPath: clusters.yaml

  modelServers:
    matchLabels:
      llm-d.ai/guide: mrl-headtohead
      llm-d.ai/role: decode
