# Cost accounting — mrl head-to-head studies.
#
# INTENTIONAL STUB. The mrl studies measure Distribution-axis scorer
# routing under asymmetric per-request service time (TP=2 vs TP=4).
# GPU-hour cost and hosted-proxy pricing are not part of that
# measurement, so every rate below is zero and every hosted_proxy price
# is a nominal $0 tier.
#
# The stub exists solely to satisfy pricing_reversal_harness/config.py's
# schema load (harness/cost.py multiplies these zeros into the journal's
# `cost` field, which the mrl head-to-head aggregator ignores).
#
# See ~/.claude/plans/evaluation-mrl-head-to-head-studies.md § 1.3 for
# the rationale — the mrl clusters.yaml likewise carries no rate labels.

_metadata:
  currency: USD
  unit: per 1M tokens (MTok)
  last_updated: "2026-<month>-<day>"
  note: "Stub for schema compliance only; every value is zero by design."

# Zero-cost GPU rates: cost.py's per-record attribution multiplies wall-clock
# by these, so every journal row records cost = 0.
gpu_hourly_rate_usd:
  h100_80gb: 0.00
  h200_141gb: 0.00

# Nominal $0 tier so any hosted_proxy lookup resolves to zero.
tiers:
  zero:
    input_price_per_MTok: 0.00
    output_price_per_MTok: 0.00
    _source: "stub for mrl_study — no pricing measured"

# Hosted-price proxies keyed by models.yaml `id`. Only one model in this study.
hosted_proxy:
  gemma-4-26b-a4b: {tier: zero}
